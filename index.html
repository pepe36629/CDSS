if(has("i_cel"))P(0,"ติดเชื้อลุกลาม: ควรส่งพบแพทย์ (ต้องประเมินและอาจต้องยาปฏิชีวนะระบบร่างกาย) ร้านยาทำไม่ได้");
if(has("i_bio"))P(1,"สงสัย biofilm: ต้อง debride แล้วปิดด้วยยาฆ่าเชื้อ (clean and cover) ควรส่งต่อเพื่อตัดแต่งแผล");
if(has("i_pus"))P(1,"มีหนอง/กลิ่น: ตรวจอาการติดเชื้อรุนแรง/ไข้ และส่งต่อถ้าไม่ดีขึ้น");
if(has("t_nec")&&(art||dm))P(1,"เนื้อตายแห้งในผู้ป่วยขาดเลือด/เบาหวาน: อย่าเติมความชื้นเองก่อนประเมินหลอดเลือด ควรส่งต่อ");
if(has("d_bo"))P(0,"เห็นกระดูก/เอ็น: ควรส่งพบแพทย์เพื่อประเมินกระดูกอักเสบ (ร้านยาทำไม่ได้) ระหว่างรอให้รักษาความชุ่มชื้น");
if(has("t_slo")&&has("d_bo"))P(2,"เนื้อสีเหลืองอาจไม่ใช่ slough (อาจเป็นไขมัน เอ็น หรือกระดูก) ตรวจให้แน่ใจ");
if(has("d_tu"))P(2,"โพรง/อุโมงค์: ต้องวัดความลึกก่อนใส่ตัวอุด ใส่หลวมๆ จดจำนวนชิ้น และเอาออกให้ครบ");
if(has("g_ro")){if(art)P(0,"ขอบม้วน + สงสัยขาดเลือด: ห้ามตัดแต่งแผลก่อนประเมินหลอดเลือด ควรส่งพบแพทย์/ศัลยแพทย์หลอดเลือด");
else if(dm)P(1,"แผลเบาหวาน ขอบม้วน/หนังด้าน: sharp debridement เป็นมาตรฐาน ต้องประเมินหลอดเลือดก่อน ควรส่งต่อ (ร้านยาทำไม่ได้)");
else P(1,"ขอบม้วน/แข็ง/หนา: ควรส่งต่อเพื่อตัดแต่งขอบแผล (ร้านยาทำไม่ได้) และทบทวนสาเหตุที่แผลไม่ลามเข้าหากัน")}
if(has("art"))P(0,"แผลขาดเลือด: ควรส่งประเมินหลอดเลือด ห้ามใช้ compression ก่อนตรวจ ABI");
if(has("burn"))P(1,"ไฟไหม้: ถ้าลึก กว้าง หรืออยู่ที่หน้า/มือ/เท้า/ข้อ ควรส่งศูนย์ไฟไหม้/แพทย์");
if(has("dm"))P(1,"แผลเบาหวาน: sharp debridement เป็นมาตรฐาน ควรประเมินหลอดเลือดและ offloading dressing เติมความชื้น/ยาฆ่าเชื้อไม่ใช่ตัวช่วยให้แผลหาย");
if(has("ven"))P(2,"หลอดเลือดดำ: compression เป็นหัวใจ (ตรวจ ABI ก่อน) แนวปฏิบัติบางฉบับไม่แนะนำ antimicrobial เฉพาะที่ ให้ทีมตัดสินใจ");
if(has("pres"))P(2,"กดทับ: ลดแรงกด (offloading/ที่นอน) ไม่มี dressing ชนิดเดียวที่ดีกว่า");
if(has("su1"))P(2,"แผลผ่าตัดเย็บปิด: film + pad ไม่เปิดก่อน 48 ชม. เว้นแต่เลือดออก/ซึมมาก");
if(has("su2"))P(2,"แผลผ่าตัดเปิดทิ้ง: ไม่ใช้ moist cotton gauze/Eusol");
if(has("p_de"))P(2,"ผิวอักเสบ/ผื่น: แยกติดเชื้อ (บวมแดงร้อน) กับแพ้กาว/ยา ถ้าไม่หายควรส่งแพทย์ (dressing แก้ไม่ได้)");
if(has("p_ma"))P(2,"ผิวเปื่อย: หาสาเหตุที่น้ำเหลืองมาก และตัด dressing ไม่ให้เกินขอบแผล");
if(fu){
if(has("f_wo"))P(0,"แผลแย่ลง: ควรส่งพบแพทย์ทันที เพื่อตรวจติดเชื้อและการไหลเวียนเลือด (ร้านยาทำไม่ได้)");
if(has("f_sm")&&has("w_ge"))P(1,"แผลหยุดหาย: ควรส่งต่อเพื่อทบทวนสาเหตุ (ขาดเลือด ติดเชื้อ/biofilm น้ำตาล โภชนาการ แรงกด) และพิจารณาการรักษาเสริม");
if(has("f_sm")&&has("w_lt"))P(2,"ยังไม่ถึงรอบทบทวน: ตรวจว่าทำตามแนวปฏิบัติพื้นฐานครบ แล้วประเมินซ้ำ");
if(has("f_ok"))P(2,"ดีขึ้น: คงแผนเดิม ประเมินซ้ำทุกครั้งที่เปลี่ยน dressing");
if(has("s_pa"))P(2,"ลดปวด: ชุบ dressing ก่อนลอก ลอกช้าๆ เลือกชนิดไม่ติดแผล");
if(has("s_bl")){P(1,"เลือดออกง่าย: ลอกเบาๆ ชุบน้ำเกลืออุ่นก่อน ถ้ากดแล้วเลือดไม่หยุด/พุ่ง ส่งพบแพทย์ทันที"+(S.prof.anticoag?" (ใช้ยาป้องกันลิ่มเลือด ตรวจสอบกับแพทย์ผู้สั่ง ห้ามหยุดยาเอง)":""));
if(has("t_gra"))P(2,"เลือดออกง่ายจากเนื้อเปราะอาจสัมพันธ์กับเชื้อมาก พิจารณาตรวจการติดเชื้อ")}
if(has("s_pc"))P(art?0:1,"ปวดเพิ่ม/ปวดตลอด: ต้องแยกสาเหตุ (ติดเชื้อ ขาดเลือด แผลหยุดหาย) ควรส่งต่อ"+(dm?" (ผู้ป่วยเบาหวานที่ไม่เจ็บ ไม่ได้แปลว่าปลอดภัย)":""))}
/* ขั้น 1: ตัดทิ้ง */
const veto={},hide={};const V=(i,r)=>(veto[i]=veto[i]||[]).push(r);
if(has("art"))["hgel","honey"].forEach(i=>V(i,"แผลขาดเลือด: ห้ามเติมความชื้น/autolytic"));
if(has("tear"))["film","hcol","iod","gauze"].forEach(i=>V(i,"ผิวฉีกขาด: กาวแรง/ทำให้ผิวแห้ง/ติดแผล"));
if(has("su2"))V("gauze","แผลผ่าตัดเปิดทิ้ง: ไม่ใช้ moist gauze");
if(S.prof.noIod)V("iod","ข้อจำกัดผู้ป่วย: ไอโอดีน");if(S.prof.noHoney)V("honey","ข้อจำกัดผู้ป่วย: น้ำผึ้ง");
const noInf=!has("i_pus")&&!has("i_bio")&&!has("i_cel");
if(noInf&&!has("burn"))["ag","phmb","dacc"].forEach(i=>hide[i]=1);
/* ขั้น 2-3: รวมคะแนน (ข้อที่เลือกหลายช่อง ใช้ค่า max ต่อข้อ) */
const rows=ID.map((id,i)=>{let tot=0,why=[],inf=0,exu=0,vr=veto[id]?veto[id].slice():[];
Q.forEach(q=>{if(!q.mx||!vis(q))return;const sc=sel[q.id].map(oid=>q.o.find(o=>o[0]===oid)).filter(o=>o&&o[3]>=0);if(!sc.length)return;
let best=0,bo="";sc.forEach(o=>{const c=M[q.mx][i][o[3]];if(c==="x")vr.push(q.t+": "+o[1]);else if(+c>best){best=+c;bo=o[1]}});
if(best){tot+=best*q.w;why.push(q.t+" / "+bo+" (+"+best*q.w+")");if(q.id==="inf")inf=best;if(q.id==="exu")exu=best}});
return{i,id,tot,why,inf,exu,vr}});
let ok=rows.filter(r=>!r.vr.length&&!hide[r.id]&&r.tot>0).sort((a,b)=>b.tot-a.tot||b.inf-a.inf||b.exu-a.exu||a.i-b.i);
const max=ok.length?ok[0].tot:0;
const urgent=labels.some(l=>l[0]===0);
if(urgent)ok=ok.slice(0,3);else ok=ok.slice(0,7);
const bad=rows.filter(r=>r.vr.length);
labels.sort((a,b)=>a[0]-b[0]);
return{labels,ok,max,bad,urgent,noInf,hide}}
</script>
<script>
const app=document.getElementById("app");
const toastElement=document.getElementById("toast");
const BODY_LOCATIONS=[
  {id:"right-arm",label:"แขนขวา",view:"front"},
  {id:"left-arm",label:"แขนซ้าย",view:"front"},
  {id:"chest",label:"หน้าอก",view:"front"},
  {id:"waist",label:"เอว",view:"front"},
  {id:"right-leg",label:"ขาขวา",view:"front"},
  {id:"left-leg",label:"ขาซ้าย",view:"front"},
  {id:"buttocks",label:"บั้นท้าย",view:"back"}
];
let toastTimer;
let nextPatientId=1;
let nextAssessmentId=1;

function showToast(message){
  toastElement.textContent=message;
  toastElement.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastElement.classList.remove("on"),2200);
}

function activePatient(){
  return S.patients.find(patient=>patient.id===S.activePatientId)||null;
}

function locationLabel(locationId){
  return BODY_LOCATIONS.find(location=>location.id===locationId)?.label||"ไม่ระบุตำแหน่ง";
}

function latestAssessment(patient,locationId){
  return patient?.assessments
    .filter(assessment=>assessment.locationId===locationId)
    .sort((a,b)=>b.timestamp.localeCompare(a.timestamp))[0]||null;
}

function copySelection(selection){
  return Object.fromEntries(Object.entries(selection).map(([id,values])=>[id,[...values]]));
}

function copyResult(result){
  return {
    labels:result.labels.map(label=>[...label]),
    ok:result.ok.map(item=>({...item,why:[...item.why],vr:[...item.vr]})),
    max:result.max,
    bad:result.bad.map(item=>({...item,why:[...item.why],vr:[...item.vr]})),
    urgent:result.urgent,
    noInf:result.noInf,
    hide:{...result.hide}
  };
}

function hasMeaningfulAssessmentInput(){
  return S.visit==="followup"||
    Object.values(S.prof).some(Boolean)||
    Q.some(question=>{
      const current=S.sel[question.id]||[];
      if(!current.length) return false;
      if(!question.df) return true;
      return current.length!==1||current[0]!==question.df;
    });
}

function renderLivePanel(){
  const panel=document.getElementById("panel");
  if(!panel) return;
  const onAssessment=location.hash==="#/assessment";
  const hasInput=hasMeaningfulAssessmentInput();
  const isVisible=onAssessment&&hasInput;
  panel.classList.toggle("on",isVisible);
  panel.classList.toggle("min",S.min);
  panel.setAttribute("aria-hidden",String(!isVisible));
  if(!isVisible){
    panel.replaceChildren();
    return;
  }

  const header=document.createElement("div");
  header.className="ph";
  const title=document.createElement("b");
  title.textContent="ผลแนะนำ (เรียลไทม์)";
  const minimize=document.createElement("button");
  minimize.type="button";
  minimize.setAttribute("aria-expanded",String(!S.min));
  minimize.textContent=S.min?"ขยาย":"ย่อ";
  minimize.addEventListener("click",()=>{
    S.min=!S.min;
    panel.classList.toggle("min",S.min);
    minimize.setAttribute("aria-expanded",String(!S.min));
    minimize.textContent=S.min?"ขยาย":"ย่อ";
  });
  header.append(title,minimize);

  const content=document.createElement("div");
  content.className="pb";
  const resultCard=document.createElement("section");
  resultCard.className="result-card";
  renderResultContent(resultCard,compute(),{guidanceAtBottom:true});
  content.append(resultCard);
  panel.replaceChildren(header,content);
  panel.classList.toggle("min",S.min);
}

function go(route){
  const currentRoute=route||location.hash||"#/";
  if(currentRoute==="#/a1"){
    location.hash="#/body";
    return;
  }
  window.scrollTo(0,0);
  if(currentRoute!=="#/assessment"){
    const panel=document.getElementById("panel");
    panel?.classList.remove("on");
    panel?.setAttribute("aria-hidden","true");
    panel?.replaceChildren();
  }
  if(currentRoute==="#/") pageHome();
  else if(currentRoute==="#/settings") pageSettings();
  else if(currentRoute==="#/body") pageBody();
  else if(currentRoute==="#/assessment") pageAssessment();
  else if(currentRoute==="#/summary") pageSummary();
  else if(currentRoute==="#/result") pageResult();
  else if(currentRoute==="#/s") pageS();
  else pageHome();
}

function topbar(title,backRoute="#/",showBack=true){
  const bar=document.createElement("div");
  bar.className="topbar";
  const heading=document.createElement("strong");
  heading.textContent=title;
  const settings=document.createElement("button");
  settings.type="button";
  settings.className="btn";
  if(title==="ตั้งค่า"){
    settings.textContent="หน้าแรก";
    settings.addEventListener("click",()=>location.hash="#/");
  }else{
    settings.textContent="ตั้งค่า";
    settings.addEventListener("click",()=>location.hash="#/settings");
  }
  if(showBack){
    const back=document.createElement("button");
    back.type="button";
    back.className="btn";
    back.textContent="← กลับ";
    back.addEventListener("click",()=>location.hash=backRoute);
    bar.append(back);
  }else{
    const spacer=document.createElement("span");
    spacer.setAttribute("aria-hidden","true");
    bar.append(spacer);
  }
  bar.append(heading,settings);
  return bar;
}

function pageHome(){
  app.replaceChildren();
  app.append(topbar("ตัวช่วยเลือก Dressing แผล","#/",false));
  const heading=document.createElement("h1");
  heading.className="page-heading";
  heading.textContent="ตัวช่วยเลือก Dressing แผล";
  const subtitle=document.createElement("p");
  subtitle.className="sub";
  subtitle.textContent="เลือกหมวดที่ต้องการ";
  const home=document.createElement("div");
  home.className="home";
  HOME_BUTTONS.forEach(item=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="hb";
    const label=document.createElement("b");
    label.textContent=item.label;
    const sub=document.createElement("span");
    sub.textContent=item.sub;
    button.append(label,sub);
    button.addEventListener("click",()=>location.hash=item.route);
    home.append(button);
  });
  app.append(heading,subtitle,home);
}

function pageSettings(){
  app.replaceChildren();
  app.append(topbar("ตั้งค่า"));
  const heading=document.createElement("h1");
  heading.className="page-heading";
  heading.textContent="ตั้งค่าและข้อมูลในเครื่อง";
  const privacy=document.createElement("section");
  privacy.className="setting-card";
  const privacyHeading=document.createElement("h2");
  privacyHeading.textContent="การจัดเก็บข้อมูล";
  const privacyText=document.createElement("p");
  privacyText.className="muted";
  privacyText.textContent="ชื่อคนไข้และประวัติการประเมินจะอยู่ในหน่วยความจำของหน้านี้เท่านั้น ไม่มีการส่งออกไปที่อื่น และจะหายเมื่อรีเฟรชหรือปิดหน้าเว็บ";
  privacy.append(privacyHeading,privacyText);

  const patients=document.createElement("section");
  patients.className="setting-card";
  const patientHeading=document.createElement("h2");
  patientHeading.textContent=`ผู้ป่วยในเซสชันนี้ (${S.patients.length})`;
  patients.append(patientHeading);
  if(S.patients.length){
    const list=document.createElement("ul");
    S.patients.forEach(patient=>{
      const item=document.createElement("li");
      item.textContent=`${patient.name} — ${patient.assessments.length} ครั้ง`;
      list.append(item);
    });
    patients.append(list);
    const clear=document.createElement("button");
    clear.type="button";
    clear.className="danger";
    clear.textContent="ลบข้อมูลผู้ป่วยจากเซสชันนี้";
    clear.addEventListener("click",()=>{
      if(!window.confirm("ลบชื่อผู้ป่วยและประวัติทั้งหมดจากหน่วยความจำของหน้านี้หรือไม่?")) return;
      S.patients.length=0;
      S.activePatientId=null;
      S.activeLocationId=null;
      S.lastAssessmentId=null;
      S.pendingAssessment=null;
      S.prof={};
      S.visit="first";
      S.draftNotes="";
      S.draftSize={length:"",width:"",depth:""};
      Q.forEach(question=>S.sel[question.id]=question.df?[question.df]:[]);
      showToast("ลบข้อมูลในหน่วยความจำแล้ว");
      pageSettings();
    });
    patients.append(clear);
  }else{
    const empty=document.createElement("p");
    empty.className="muted";
    empty.textContent="ยังไม่มีข้อมูลผู้ป่วยในเซสชันนี้";
    patients.append(empty);
  }
  const note=document.createElement("p");
  note.className="disclaimer";
  note.textContent="ต้นแบบนี้เป็นเครื่องมือช่วยรวบรวมข้อมูล ไม่ใช่การวินิจฉัยหรือคำสั่งรักษา ควรให้บุคลากรทางการแพทย์ตรวจสอบคำแนะนำก่อนนำไปใช้จริง";
  app.append(heading,privacy,patients,note);
}

function patientSelector(){
  const section=document.createElement("section");
  section.className="patient-card";
  const heading=document.createElement("h2");
  heading.textContent="ข้อมูลผู้ป่วย";
  const help=document.createElement("p");
  help.className="muted";
  help.textContent="กรอกชื่อเพื่อเริ่มติดตาม หรือเลือกชื่อที่ใช้แล้วในเซสชันนี้";
  const form=document.createElement("div");
  form.className="patient-form";
  const nameRow=document.createElement("div");
  nameRow.className="form-row";
  const nameLabel=document.createElement("label");
  nameLabel.htmlFor="patient-name";
  nameLabel.textContent="ชื่อผู้ป่วย";
  const nameInput=document.createElement("input");
  nameInput.id="patient-name";
  nameInput.autocomplete="off";
  nameInput.placeholder="กรอกชื่อหรือรหัสที่ใช้ระบุตัวผู้ป่วย";
  nameInput.value=activePatient()?.name||"";
  nameRow.append(nameLabel,nameInput);

  const selectRow=document.createElement("div");
  selectRow.className="form-row";
  const select=document.createElement("select");
  select.setAttribute("aria-label","เลือกผู้ป่วยที่มีในเซสชัน");
  const placeholder=document.createElement("option");
  placeholder.value="";
  placeholder.textContent="เลือกผู้ป่วยเดิม";
  select.append(placeholder);
  S.patients.forEach(patient=>{
    const option=document.createElement("option");
    option.value=patient.id;
    option.textContent=`${patient.name} (${patient.assessments.length} ครั้ง)`;
    option.selected=patient.id===S.activePatientId;
    select.append(option);
  });
  select.addEventListener("change",()=>{
    const patient=S.patients.find(item=>item.id===select.value);
    if(patient) nameInput.value=patient.name;
  });
  selectRow.append(select);

  const start=document.createElement("button");
  start.type="button";
  start.className="primary";
  start.textContent="บันทึกชื่อและเลือกตำแหน่ง";
  start.addEventListener("click",()=>{
    const name=nameInput.value.trim();
    if(!name){
      nameInput.setCustomValidity("กรุณากรอกชื่อหรือรหัสผู้ป่วย");
      nameInput.reportValidity();
      return;
    }
    nameInput.setCustomValidity("");
    let patient=S.patients.find(item=>item.name.trim().toLocaleLowerCase()===name.toLocaleLowerCase());
    if(!patient){
      patient={id:`patient-${nextPatientId++}`,name,assessments:[]};
      S.patients.push(patient);
    }
    S.activePatientId=patient.id;
    renderBodyPage();
    showToast(`เลือกผู้ป่วย ${patient.name} แล้ว`);
  });
  form.append(nameRow,selectRow,start);
  section.append(heading,help,form);
  return section;
}

function bodyMap(view){
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 300 340");
  svg.setAttribute("class","body-figure");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label",view==="front"?"ภาพเลือกตำแหน่งด้านหน้า":"ภาพเลือกตำแหน่งด้านหลัง");
  const shape=view==="front"
    ? `<circle class="person" cx="150" cy="35" r="23"/><path class="person" d="M130 64 Q150 55 170 64 L190 145 L177 178 L173 208 L184 310 L157 310 L150 220 L143 310 L116 310 L127 208 L123 178 L110 145 Z"/><path class="person" d="M116 75 L88 88 L58 162 L74 170 L110 123 M184 75 L212 88 L242 162 L226 170 L190 123" fill="none" stroke="var(--mu)" stroke-width="18" stroke-linecap="round"/>`
    : `<circle class="person" cx="150" cy="35" r="23"/><path class="person" d="M130 64 Q150 55 170 64 L190 145 L177 178 L173 208 L184 310 L157 310 L150 220 L143 310 L116 310 L127 208 L123 178 L110 145 Z"/><path class="person" d="M116 75 L88 88 L58 162 L74 170 L110 123 M184 75 L212 88 L242 162 L226 170 L190 123" fill="none" stroke="var(--mu)" stroke-width="18" stroke-linecap="round"/>`;
  svg.innerHTML=shape;
  const zones=view==="front"
    ? [
      ["right-arm",68,104,35,50,"แขนขวา"],
      ["left-arm",197,104,35,50,"แขนซ้าย"],
      ["chest",126,77,48,38,"หน้าอก"],
      ["waist",126,121,48,34,"เอว"],
      ["right-leg",116,202,25,72,"ขาขวา"],
      ["left-leg",159,202,25,72,"ขาซ้าย"]
    ]
    : [
      ["right-arm",68,104,35,50,"แขนขวา"],
      ["left-arm",197,104,35,50,"แขนซ้าย"],
      ["buttocks",125,135,50,42,"บั้นท้าย"],
      ["right-leg",116,202,25,72,"ขาขวา"],
      ["left-leg",159,202,25,72,"ขาซ้าย"]
    ];
  zones.forEach(([id,x,y,w,h,label])=>{
    const group=document.createElementNS("http://www.w3.org/2000/svg","g");
    group.dataset.location=id;
    group.setAttribute("role","button");
    group.setAttribute("tabindex","0");
    group.setAttribute("aria-label",label);
    const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
    rect.setAttribute("class","hit");
    rect.setAttribute("x",x);rect.setAttribute("y",y);rect.setAttribute("width",w);rect.setAttribute("height",h);
    rect.setAttribute("rx","9");
    const text=document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("class","area-label");
    text.setAttribute("x",Number(x)+Number(w)/2);
    text.setAttribute("y",Number(y)+Number(h)/2+3);
    text.setAttribute("text-anchor","middle");
    text.textContent=label;
    group.append(rect,text);
    const activate=()=>openLocation(id);
    group.addEventListener("click",activate);
    group.addEventListener("keydown",event=>{
      if(event.key==="Enter"||event.key===" "){event.preventDefault();activate()}
    });
    svg.append(group);
  });
  return svg;
}

function resetAssessmentDraft(locationId){
  S.activeLocationId=locationId;
  S.pendingAssessment=null;
  Q.forEach(question=>S.sel[question.id]=question.df?[question.df]:[]);
  S.prof={};
  S.draftNotes="";
  S.draftSize={length:"",width:"",depth:""};
  const previous=latestAssessment(activePatient(),locationId);
  S.visit=previous?"followup":"first";
  S.lastAssessmentId=null;
}

function openLocation(locationId){
  if(!activePatient()){
    showToast("กรุณาเลือกหรือกรอกชื่อผู้ป่วยก่อน");
    document.getElementById("patient-name")?.focus();
    return;
  }
  resetAssessmentDraft(locationId);
  location.hash="#/assessment";
}

function renderBodyPage(){
  app.replaceChildren();
  app.append(topbar("เลือกตำแหน่งแผล"));
  const heading=document.createElement("h1");
  heading.className="page-heading";
  heading.textContent="เลือกตำแหน่งที่ต้องการประเมิน";
  const hint=document.createElement("p");
  hint.className="sub";
  hint.textContent="เลือกตำแหน่งบนภาพ หรือเลือกจากรายการด้านล่าง";
  app.append(heading,hint,patientSelector());
  if(!activePatient()) return;

  const layout=document.createElement("section");
  layout.className="body-layout panel-box";
  const figureArea=document.createElement("div");
  const switcher=document.createElement("div");
  switcher.className="view-switch";
  ["front","back"].forEach(view=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="view-toggle";
    button.setAttribute("aria-pressed",String(S.bodyView===view));
    button.textContent=view==="front"?"ด้านหน้า":"ด้านหลัง";
    button.addEventListener("click",()=>{S.bodyView=view;renderBodyPage()});
    switcher.append(button);
  });
  figureArea.append(switcher,bodyMap(S.bodyView));

  const optionsArea=document.createElement("div");
  const patientHeading=document.createElement("h2");
  patientHeading.textContent=`ผู้ป่วย: ${activePatient().name}`;
  const optionsHeading=document.createElement("h2");
  optionsHeading.textContent="ตำแหน่งแผล";
  const list=document.createElement("div");
  list.className="location-list";
  BODY_LOCATIONS.forEach(location=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="location-button";
    const label=document.createElement("span");
    label.textContent=location.label;
    const previous=latestAssessment(activePatient(),location.id);
    const note=document.createElement("small");
    note.textContent=previous?`ประเมินล่าสุด ${new Date(previous.timestamp).toLocaleDateString("th-TH")}`:"ยังไม่มีประวัติ";
    button.append(label,note);
    button.addEventListener("click",()=>openLocation(location.id));
    list.append(button);
  });
  optionsArea.append(patientHeading,optionsHeading,list);
  layout.append(figureArea,optionsArea);
  app.append(layout);

  if(activePatient().assessments.length){
    const history=document.createElement("section");
    history.className="patient-history";
    const historyHeading=document.createElement("h2");
    historyHeading.textContent="ประวัติการประเมิน";
    const records=document.createElement("ul");
    [...activePatient().assessments].reverse().forEach(assessment=>{
      const item=document.createElement("li");
      const button=document.createElement("button");
      button.type="button";
      button.className="secondary";
      button.textContent=`${locationLabel(assessment.locationId)} — ${new Date(assessment.timestamp).toLocaleString("th-TH")}`;
      button.addEventListener("click",()=>{S.lastAssessmentId=assessment.id;location.hash="#/result"});
      item.append(button);
      records.append(item);
    });
    history.append(historyHeading,records);
    app.append(history);
  }
}

function pageBody(){
  renderBodyPage();
}

function previousDressingCard(patient,locationId){
  const previous=latestAssessment(patient,locationId);
  const card=document.createElement("section");
  card.className="previous-card";
  const heading=document.createElement("h2");
  heading.textContent="ผล Dressing ครั้งก่อน";
  card.append(heading);
  const detail=document.createElement("p");
  if(previous?.dispensedDressings?.length){
    detail.textContent=previous.dispensedDressings.map(id=>DR[ID.indexOf(id)]).filter(Boolean).join(", ");
  }else if(previous){
    detail.textContent="ครั้งก่อนยังไม่มีข้อมูล Dressing ที่เลือกจ่าย";
  }else{
    detail.textContent="ยังไม่มีประวัติการประเมินตำแหน่งนี้";
  }
  card.append(detail);
  if(previous){
    const date=document.createElement("p");
    date.className="muted";
    date.textContent=`ประเมินเมื่อ ${new Date(previous.timestamp).toLocaleString("th-TH")}`;
    card.append(date);
  }
  return card;
}

function pageAssessment(){
  const patient=activePatient();
  if(!patient||!S.activeLocationId){
    location.hash="#/body";
    return;
  }
  app.replaceChildren();
  app.append(topbar("ประเมินแผล","#/body"));
  const heading=document.createElement("h1");
  heading.className="page-heading";
  heading.textContent="ข้อมูลการประเมิน";
  const identity=document.createElement("p");
  identity.className="sub";
  identity.textContent=`${patient.name} · ${locationLabel(S.activeLocationId)}`;
  app.append(heading,identity,previousDressingCard(patient,S.activeLocationId));

  const visitPanel=document.createElement("section");
  visitPanel.className="panel-box assessment-profile";
  const visitTitle=document.createElement("h2");
  visitTitle.textContent="รอบการประเมิน";
  const choices=document.createElement("div");
  choices.className="seg";
  [["first","ประเมินครั้งแรก"],["followup","ติดตามอาการ"]].forEach(([value,label])=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="chip";
    button.setAttribute("aria-pressed",String(S.visit===value));
    button.textContent=label;
    button.addEventListener("click",()=>{
      S.visit=value;
      renderAssessmentPage();
    });
    choices.append(button);
  });
  visitPanel.append(visitTitle,choices);
  PROF.forEach(([id,label])=>{
    const row=document.createElement("label");
    row.className="profile-option";
    const checkbox=document.createElement("input");
    checkbox.type="checkbox";
    checkbox.checked=Boolean(S.prof[id]);
    checkbox.addEventListener("change",()=>{
      S.prof[id]=checkbox.checked;
      renderLivePanel();
    });
    row.append(checkbox,document.createTextNode(label));
    visitPanel.append(row);
  });
  app.append(visitPanel);

  const questions=document.createElement("div");
  questions.id="qs";
  Q.filter(question=>!question.f||S.visit==="followup").forEach(question=>{
    const fieldset=document.createElement("fieldset");
    const legend=document.createElement("legend");
    legend.textContent=question.t;
    fieldset.append(legend);
    if(question.d){
      const description=document.createElement("div");
      description.className="d";
      description.textContent=question.d;
      fieldset.append(description);
    }
    const grid=document.createElement("div");
    grid.className="g";
    question.o.forEach(option=>{
      const button=document.createElement("button");
      button.type="button";
      button.className="chip";
      button.id=`option-${option[0]}`;
      button.dataset.o=option[0];
      button.setAttribute("aria-pressed",String(S.sel[question.id].includes(option[0])));
      const indicator=document.createElement("span");
      indicator.className="bx";
      indicator.textContent="✓";
      const label=document.createElement("span");
      label.append(document.createTextNode(option[1]));
      if(option[2]){
        const hint=document.createElement("small");
        hint.textContent=option[2];
        label.append(hint);
      }
      button.append(indicator,label);
      button.addEventListener("click",()=>{
        const id=option[0];
        const selected=S.sel[question.id];
        const turningOn=!selected.includes(id);
        if(question.m==="single"){
          S.sel[question.id]=turningOn?[id]:[];
        }else if(turningOn){
          S.sel[question.id]=id===question.x?[id]:selected.filter(value=>value!==question.x).concat(id);
        }else{
          S.sel[question.id]=selected.filter(value=>value!==id);
        }
        if(question.df&&!S.sel[question.id].length) S.sel[question.id]=[question.df];
        renderAssessmentPage();
        document.getElementById(`option-${id}`)?.focus();
      });
      grid.append(button);
    });
    fieldset.append(grid);
    questions.append(fieldset);
  });
  app.append(questions);

  const details=document.createElement("section");
  details.className="panel-box";
  const detailsHeading=document.createElement("h2");
  detailsHeading.textContent="รายละเอียดแผลเพิ่มเติม";
  details.append(detailsHeading);
  const sizeGrid=document.createElement("div");
  sizeGrid.className="location-list";
  [["length","ยาว (ซม.)"],["width","กว้าง (ซม.)"],["depth","ลึก (ซม.)"]].forEach(([key,label])=>{
    const wrapper=document.createElement("div");
    wrapper.className="form-row";
    const inputLabel=document.createElement("label");
    inputLabel.textContent=label;
    const input=document.createElement("input");
    input.type="number";input.min="0";input.step="0.1";input.value=S.draftSize[key];
    input.addEventListener("input",()=>S.draftSize[key]=input.value);
    wrapper.append(inputLabel,input);
    sizeGrid.append(wrapper);
  });
  const noteRow=document.createElement("div");
  noteRow.className="form-row";
  const noteLabel=document.createElement("label");
  noteLabel.htmlFor="wound-notes";
  noteLabel.textContent="บันทึกเพิ่มเติม";
  const noteInput=document.createElement("textarea");
  noteInput.id="wound-notes";
  noteInput.value=S.draftNotes;
  noteInput.addEventListener("input",()=>S.draftNotes=noteInput.value);
  noteRow.append(noteLabel,noteInput);
  details.append(sizeGrid,noteRow);
  app.append(details);

  const actions=document.createElement("div");
  actions.className="step-actions";
  const back=document.createElement("button");
  back.type="button";back.className="secondary";back.textContent="กลับเลือกตำแหน่ง";
  back.addEventListener("click",()=>location.hash="#/body");
  const confirm=document.createElement("button");
  confirm.type="button";confirm.className="primary";confirm.textContent="ส่งไปหน้าสรุปผล";
  confirm.addEventListener("click",prepareAssessmentSummary);
  actions.append(back,confirm);
  app.append(actions);
  renderLivePanel();
}

function renderAssessmentPage(){
  pageAssessment();
}

function prepareAssessmentSummary(){
  const patient=activePatient();
  if(!patient||!S.activeLocationId) return;
  S.pendingAssessment={
    id:`draft-${nextAssessmentId}`,
    locationId:S.activeLocationId,
    timestamp:new Date().toISOString(),
    visit:S.visit,
    selection:copySelection(S.sel),
    profile:{...S.prof},
    size:{...S.draftSize},
    notes:S.draftNotes,
    result:copyResult(compute()),
    dispensedDressings:[]
  };
  location.hash="#/summary";
}

function confirmSaveAssessment(){
  const patient=activePatient();
  if(!patient||!S.pendingAssessment) return;
  const record={...S.pendingAssessment,dispensedDressings:[...S.pendingAssessment.dispensedDressings],id:`assessment-${nextAssessmentId++}`};
  patient.assessments.push(record);
  S.lastAssessmentId=record.id;
  S.pendingAssessment=null;
  location.hash="#/result";
}

function renderResultContent(container,result,{guidanceAtBottom=false,dispensedDressings=null,onDispensedChange=null}={}){
  const safety=document.createElement("p");
  safety.className="disclaimer";
  safety.textContent="ผลนี้เป็นแนวทางอ้างอิงจากข้อมูลที่เลือก ไม่ใช่การวินิจฉัยหรือคำสั่งรักษา ต้องประเมินผู้ป่วยจริงและให้บุคลากรทางการแพทย์ทบทวน";
  container.append(safety);

  const appendGuidance=()=>{
    const labelsHeading=document.createElement("h2");
    labelsHeading.textContent="ข้อควรทำและข้อควรทราบ";
    container.append(labelsHeading);
    if(result.labels.length){
      result.labels.forEach(([priority,text])=>{
        const label=document.createElement("div");
        label.className=`lb l${priority}`;
        const badge=document.createElement("i");
        badge.textContent=priority===0?"เร่งด่วน":priority===1?"เตือน":"ข้อมูล";
        label.append(badge,document.createTextNode(text));
        container.append(label);
      });
    }else{
      const none=document.createElement("p");
      none.className="muted";
      none.textContent="ไม่มีคำเตือนเพิ่มเติมจากตัวเลือกนี้";
      container.append(none);
    }
  };
  if(!guidanceAtBottom) appendGuidance();

  const recommendationsHeading=document.createElement("h2");
  recommendationsHeading.textContent=result.urgent?"ดูแลเบื้องต้นระหว่างรอพบแพทย์":"Dressing ที่แนะนำ";
  container.append(recommendationsHeading);
  if(!result.ok.length){
    const noResult=document.createElement("p");
    noResult.className="muted";
    noResult.textContent="ไม่มีตัวเลือกที่ผ่านเงื่อนไข ควรปรึกษาผู้เชี่ยวชาญ";
    container.append(noResult);
  }
  const dispensedIds=dispensedDressings||[];
  result.ok.forEach((item,index)=>{
    const recommendation=document.createElement("details");
    recommendation.className=`recommendation${item.id==="ag"&&!result.noInf&&index===0?" must":""}`;
    const summary=document.createElement("summary");
    const name=document.createElement("strong");
    name.textContent=DR[item.i];
    const score=document.createElement("span");
    score.className="pill";
    score.textContent=item.id==="ag"&&!result.noInf&&index===0
      ?"ควรมี"
      :item.tot>=result.max*.8?"แนะนำ":"ใช้ได้";
    summary.append(name,score);
    recommendation.append(summary);
    const scoreDetail=document.createElement("p");
    scoreDetail.className="score-detail";
    scoreDetail.textContent=`คะแนน: ${item.tot}`;
    recommendation.append(scoreDetail);
    const reasons=document.createElement("ul");
    item.why.forEach(reason=>{
      const li=document.createElement("li");
      li.textContent=reason;
      reasons.append(li);
    });
    recommendation.append(reasons);
    if(onDispensedChange){
      const option=document.createElement("div");
      option.className="dispense-option";
      const button=document.createElement("button");
      button.type="button";
      button.className="dispense-toggle";
      const updateButton=()=>{
        const selected=dispensedIds.includes(item.id);
        button.setAttribute("aria-pressed",String(selected));
        button.textContent=selected?"เลือกจ่ายแล้ว ✓":"เลือกจ่าย";
      };
      button.addEventListener("click",()=>{
        const selected=dispensedIds.includes(item.id);
        if(selected) dispensedIds.splice(dispensedIds.indexOf(item.id),1);
        else dispensedIds.push(item.id);
        updateButton();
        onDispensedChange(dispensedIds);
      });
      updateButton();
      option.append(recommendation,button);
      container.append(option);
    }else{
      container.append(recommendation);
    }
  });

  if(result.bad.length){
    const avoidHeading=document.createElement("h2");
    avoidHeading.textContent="ควรหลีกเลี่ยง";
    container.append(avoidHeading);
    result.bad.forEach(item=>{
      const avoid=document.createElement("details");
      avoid.className="recommendation avoid";
      const summary=document.createElement("summary");
      summary.textContent=DR[item.i];
      avoid.append(summary);
      const reasons=document.createElement("ul");
      item.vr.forEach(reason=>{
        const li=document.createElement("li");
        li.textContent=reason;
        reasons.append(li);
      });
      avoid.append(reasons);
      container.append(avoid);
    });
  }
  if(result.ok.some(item=>["ag","iod","phmb","honey","dacc"].includes(item.id))){
    const antimicrobialNote=document.createElement("p");
    antimicrobialNote.className="muted";
    antimicrobialNote.textContent="ยาฆ่าเชื้อ: ทบทวนที่ 2 สัปดาห์ ไม่ใช้ต่อเกิน 4 สัปดาห์โดยไม่มีเหตุ";
    container.append(antimicrobialNote);
  }
  if(guidanceAtBottom) appendGuidance();
}

function renderAssessmentSummary(record,isPending){
  const patient=activePatient();
  app.replaceChildren();
  app.append(topbar(isPending?"สรุปผลก่อนบันทึก":"ผลการประเมิน",isPending?"#/assessment":"#/body"));
  const heading=document.createElement("h1");
  heading.className="page-heading";
  heading.textContent=isPending?"สรุปผลการประเมิน":"ผลและคำแนะนำ";
  let instructions=null;
  if(isPending){
    instructions=document.createElement("p");
    instructions.className="sub";
    instructions.textContent="ตรวจทานข้อมูลและคำแนะนำก่อนยืนยันบันทึกประวัติ";
  }
  const summary=document.createElement("section");
  summary.className="result-summary";
  [patient.name,locationLabel(record.locationId),new Date(record.timestamp).toLocaleString("th-TH")].forEach(text=>{
    const pill=document.createElement("span");pill.className="pill";pill.textContent=text;summary.append(pill);
  });
  const panel=document.createElement("section");
  panel.className="result-card";
  const dispensedSection=document.createElement("section");
  dispensedSection.className="setting-card dispensed-list";
  const dispensedHeading=document.createElement("h2");
  dispensedHeading.textContent="รายการที่เภสัชกรเลือกจ่าย";
  const dispensedItems=document.createElement("p");
  dispensedItems.className="muted";
  const updateDispensedItems=items=>{
    dispensedItems.textContent=items.length
      ?items.map(id=>DR[ID.indexOf(id)]).filter(Boolean).join(", ")
      :"ยังไม่ได้เลือก Dressing ที่จ่าย";
  };
  updateDispensedItems(record.dispensedDressings||[]);
  dispensedSection.append(dispensedHeading,dispensedItems);
  renderResultContent(panel,record.result,{
    dispensedDressings:isPending?record.dispensedDressings:null,
    onDispensedChange:isPending?updateDispensedItems:null
  });

  const wound=document.createElement("section");
  wound.className="setting-card";
  const woundHeading=document.createElement("h2");
  woundHeading.textContent="บันทึกแผล";
  const measurements=document.createElement("p");
  const size=record.size;
  const sizeText=[size.length&&`ยาว ${size.length} ซม.`,size.width&&`กว้าง ${size.width} ซม.`,size.depth&&`ลึก ${size.depth} ซม.`].filter(Boolean).join(" · ");
  measurements.textContent=sizeText||"ไม่ได้ระบุขนาด";
  const notes=document.createElement("p");
  notes.textContent=record.notes||"ไม่มีบันทึกเพิ่มเติม";
  wound.append(woundHeading,measurements,notes);
  const actions=document.createElement("div");
  actions.className="step-actions";
  const edit=document.createElement("button");
  edit.type="button";edit.className="secondary";edit.textContent="กลับไปแก้ไข";
  edit.addEventListener("click",()=>location.hash="#/assessment");
  if(isPending){
    const save=document.createElement("button");
    save.type="button";save.className="primary";save.textContent="ยืนยันและบันทึกข้อมูล";
    save.addEventListener("click",confirmSaveAssessment);
    actions.append(edit,save);
  }else{
    const locations=document.createElement("button");
    locations.type="button";locations.className="primary";locations.textContent="เลือกตำแหน่งอื่น";
    locations.addEventListener("click",()=>location.hash="#/body");
    actions.append(edit,locations);
  }
  app.append(heading);
  if(instructions) app.append(instructions);
  app.append(summary,panel,dispensedSection,wound,actions);
}

function pageSummary(){
  const patient=activePatient();
  if(!patient||!S.pendingAssessment){
    location.hash="#/body";
    return;
  }
  renderAssessmentSummary(S.pendingAssessment,true);
}

function pageResult(){
  const patient=activePatient();
  const record=patient?.assessments.find(item=>item.id===S.lastAssessmentId);
  if(!patient||!record){
    location.hash="#/body";
    return;
  }
  renderAssessmentSummary(record,false);
}

function pageS(){
  app.replaceChildren();
  app.append(topbar("S"));
  const heading=document.createElement("h1");
  heading.className="page-heading";
  heading.textContent="หน้านี้ยังไม่มีเนื้อหา";
  const subtitle=document.createElement("p");
  subtitle.className="sub";
  subtitle.textContent="จะเพิ่มในขั้นตอนถัดไป";
  app.append(heading,subtitle);
}

addEventListener("hashchange",()=>go());
go();
