<svg id="heartBandaidSvg" width="100%" height="100%" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg" class="max-h-full">
                <defs>
                    <!-- Dot Pattern for Band-Aid Perforations -->
                    <pattern id="dotPattern" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
                        <circle cx="8" cy="8" r="1.5" fill="#D96E58" opacity="0.6"></circle>
                    </pattern>
                </defs>

                <!-- SINGLE BAND-AID GROUP WITH HEART (Rotated 45 degrees for dynamic look) -->
                <g transform="translate(250, 250) rotate(-45)">
                    <!-- Outer Plaster Body (Capsule shape) -->
                    <rect x="-65" y="-170" width="130" height="340" rx="65" fill="#EE9A85"></rect>

                    <!-- Perforation Dots (Left & Right Sections) -->
                    <rect x="-57" y="-162" width="114" height="324" rx="57" fill="url(#dotPattern)"></rect>

                    <!-- Center Gauze Pad -->
                    <rect x="-65" y="-55" width="130" height="110" rx="12" fill="#FCEBE6"></rect>

                    <!-- Red Heart Icon on Center Pad -->
                    <path d="M 0 -18
                             C 0 -18, -6 -32, -20 -32
                             C -36 -32, -45 -18, -45 -2
                             C -45 22, -15 42, 0 54
                             C 15 42, 45 22, 45 -2
                             C 45 -18, 36 -32, 20 -32
                             C 6 -32, 0 -18, 0 -18 Z" fill="#E53E3E"></path>
                </g>
            </svg>